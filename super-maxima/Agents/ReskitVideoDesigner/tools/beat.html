<!doctype html>
<html><head><meta charset="utf-8">
<style>
  /* Text beat near the top of the frame (inside the safe area), in the plain native caption style.
     Render: node render_html.js "beat.html#<urlencoded text>" beat.png  → 1080x1920 transparent */
  html, body { margin: 0; width: 360px; height: 640px; background: transparent; overflow: hidden; }
  .frame { position: relative; width: 360px; height: 640px; overflow: hidden; }
  .t { position: absolute; left: 34px; right: 34px; top: 92px;
    font: 600 16.5px/1.25 -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; color: #fff; text-align: center;
    text-wrap: balance; text-shadow: 0 0 2px rgba(0,0,0,.8), 0 1px 3px rgba(0,0,0,.55), 0 0 8px rgba(0,0,0,.25); }
</style></head>
<body><div class="frame"><div class="t" id="t"></div></div>
<script>document.getElementById("t").textContent = decodeURIComponent(location.hash.slice(1));</script></body></html>
