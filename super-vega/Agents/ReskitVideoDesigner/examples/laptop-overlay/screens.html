<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Inter:wght@400;500;600&display=block" rel="stylesheet">
<style>
/* Pexo screens for 58-test-10-29, rebuilt from pexo.ai's own captures
   (home page and the "How Pexo Delivers A Full Video" product mockups, brand/ui/2026-10-29-pexo-t58/how).
   Render at 1440x900, scale 2. The state is the URL hash. */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1440px;height:900px;overflow:hidden;background:#f9f7f1;font-family:Inter,system-ui,sans-serif;color:#2a2923}
.bar{position:absolute;left:0;top:0;width:1440px;height:44px;background:#e9e8ee;border-bottom:1px solid #d6d5dc;display:flex;align-items:center;padding:0 14px;gap:14px}
.dots{display:flex;gap:8px}.dots i{width:12px;height:12px;border-radius:50%;background:#c9c8cf;display:block}
.tab{height:32px;margin-top:12px;background:#f9f9fb;border-radius:9px 9px 0 0;padding:0 16px;display:flex;align-items:center;gap:8px;font-size:13px;color:#3b3a40;width:220px}
.tab img{width:16px;height:16px}
.url{flex:1;height:28px;background:#fff;border-radius:14px;display:flex;align-items:center;padding:0 14px;font-size:13.5px;color:#55545c;margin-right:300px}
.page{position:absolute;left:0;top:44px;width:1440px;height:856px;overflow:hidden}
.home{width:1440px;display:block}
.sky{position:absolute;inset:0;background:linear-gradient(180deg,#d9d8f4 0%,#e6e4f3 35%,#f3efea 75%,#f7f2ea 100%)}
.cloud{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.85),rgba(255,255,255,0));filter:blur(6px)}
.logo{position:absolute;left:28px;top:22px;height:30px}
.card{position:absolute;left:50%;transform:translateX(-50%);top:250px;width:800px;background:#fff;border-radius:18px;box-shadow:0 8px 30px rgba(60,55,90,.10);padding:18px 18px 16px}
.chips{display:flex;gap:14px}
.chip{display:flex;align-items:center;gap:10px;border:1px solid #ecebf0;border-radius:9px;padding:8px 16px 8px 9px;font-family:Outfit;font-size:19px;color:#3a3940;background:#fdfdfd}
.ico{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center}
.txt{font-family:Outfit;font-size:20px;color:#2f2e34;line-height:1.45;margin:16px 0 0;min-height:58px}
.caret{display:inline-block;width:2px;height:22px;background:#2f2e34;vertical-align:-4px;margin-left:1px}
.files{display:flex;gap:10px;margin-top:12px;min-height:0}
.file{display:flex;align-items:center;gap:8px;border:1px solid #ecebf0;border-radius:9px;padding:5px 12px 5px 5px;font-size:13.5px;color:#4a4950;background:#fafafc}
.file img{width:34px;height:34px;border-radius:6px;object-fit:cover}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.plus{width:36px;height:36px;border-radius:50%;border:1px solid #e5e5df;display:flex;align-items:center;justify-content:center;font-size:22px;color:#3a3940;font-weight:300}
.send{width:38px;height:38px;border-radius:50%;background:#2a2923;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px}
.send.off{background:#e5e5df;color:#a8a99d}
.cursor{position:absolute;width:26px;height:36px;z-index:9}
.win{position:absolute;left:150px;top:30px;width:1140px;height:800px;background:rgba(252,252,254,.96);border-radius:16px;box-shadow:0 10px 40px rgba(60,55,90,.12)}
.wtitle{position:absolute;top:18px;left:0;right:0;text-align:center;font-family:Outfit;font-size:15px;color:#2a2923;font-weight:500}
.x{position:absolute;right:20px;top:14px;width:26px;height:26px;border-radius:50%;border:1px solid #ecebf0;display:flex;align-items:center;justify-content:center;font-size:14px;color:#333;background:#fff}
.ubub{position:absolute;left:310px;top:70px;width:560px;background:#e6ecfb;border-radius:12px;padding:12px 14px}
.ubub .chip{font-size:14px;padding:4px 10px 4px 5px;gap:6px}.ubub .ico{width:22px;height:22px}
.ubub p{font-size:14.5px;color:#2f2e34;line-height:1.5;margin-top:10px}
.ubub .files{margin-top:10px}.ubub .file{font-size:12px}.ubub .file img{width:26px;height:26px}
.reply{position:absolute;left:190px;top:270px;width:760px}
.who{display:flex;align-items:center;gap:6px;font-family:Outfit;font-weight:500;font-size:17px}
.who img{height:22px}
.reply p{font-size:15px;color:#3a3940;line-height:1.55;margin-top:12px}
.plan{margin-top:16px;background:#f3f3f2;border-radius:12px;padding:14px 16px;width:600px}
.plan h4{font-family:Outfit;font-weight:500;font-size:16px;display:flex;gap:8px;align-items:center;padding-bottom:10px;border-bottom:1px solid #e4e4e1}
.plan li{list-style:none;display:flex;gap:10px;align-items:center;font-size:14.5px;color:#9d9c97;margin-top:11px}
.plan li.done{color:#55545a}
.plan li b{width:15px;height:15px;border-radius:50%;border:1.5px solid #cfcfcb;display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:#fff}
.plan li.done b{background:#9b9a96;border-color:#9b9a96}
.plan li.now b{border-color:#7b74e8;border-top-color:transparent}
/* ready */
.rh{position:absolute;left:64px;top:76px;font-family:Outfit;font-size:34px;font-weight:500;color:#2a2923}
.rs{position:absolute;left:64px;top:124px;font-family:Outfit;font-size:19px;color:#9e9e9e}
.rlogo{position:absolute;left:64px;top:22px;height:22px}
.player{position:absolute;left:360px;top:168px;width:340px;height:604px;border-radius:12px;overflow:hidden;background:#111}
.player img{width:100%;height:100%;object-fit:cover;display:block}
.sub{position:absolute;left:0;right:0;bottom:74px;text-align:center;font-family:Outfit;font-weight:600;font-size:23px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.ctl{position:absolute;left:0;right:0;bottom:0;height:46px;background:linear-gradient(transparent,rgba(0,0,0,.65));display:flex;align-items:center;padding:0 14px;gap:10px;color:#fff;font-size:12.5px}
.prog{position:absolute;left:14px;right:14px;bottom:44px;height:3px;background:rgba(255,255,255,.35);border-radius:2px}
.prog i{display:block;height:100%;background:#fff;border-radius:2px}
.side{position:absolute;left:760px;top:200px;width:250px}
.scard{background:#fff;border:1px solid #ecebf0;border-radius:12px;padding:12px 14px;margin-bottom:14px;display:flex;align-items:center;gap:10px;font-family:Outfit;font-size:17px}
.scard .ok{margin-left:auto;width:20px;height:20px;border-radius:50%;background:#3cb563;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center}
.dotline{position:absolute;left:704px;top:228px;width:54px;border-top:2px dotted #b8b7c4}
/* commenting */
.cframe{position:absolute;left:40px;top:58px;width:1060px;height:720px;border:2px solid #f6a04d;border-radius:12px}
.ctag{position:absolute;left:50%;transform:translateX(-50%);top:-14px;background:#f6a04d;color:#fff;font-family:Outfit;font-size:15px;padding:3px 14px;border-radius:4px}
.fname{position:absolute;left:18px;top:14px;font-size:13px;color:#333;display:flex;gap:8px;align-items:center}
.fname i{width:0;height:0;border-left:9px solid #5b6cf0;border-top:6px solid transparent;border-bottom:6px solid transparent}
.tools{position:absolute;left:240px;top:44px;background:#fff;border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.15);padding:6px 14px;display:flex;gap:14px;align-items:center;font-size:14px;color:#444;z-index:3}
.tools .pen{width:22px;height:22px;border-radius:50%;background:#dfe6ff;color:#4a63e8;display:flex;align-items:center;justify-content:center}
.tools .c{width:13px;height:13px;border-radius:50%}
.cplayer{position:absolute;left:16px;top:56px;width:680px;height:648px;background:#0d0d0f;border-radius:10px;overflow:hidden}
.cplayer img{position:absolute;left:50%;top:22px;transform:translateX(-50%);height:560px;width:315px;object-fit:cover;border-radius:6px}
.mark{position:absolute;border:3px solid #f04b3b;border-radius:50%;z-index:2}
.cbox{position:absolute;left:720px;top:56px;width:320px;height:250px;border:1px solid #e2e2e6;border-radius:12px;background:#fff;padding:14px}
.pill{display:inline-block;background:#ffe3c8;color:#e8893a;font-size:12.5px;border-radius:9px;padding:2px 9px}
.cbox p{font-size:15.5px;color:#2f2e34;margin-top:14px;line-height:1.5}
.csend{position:absolute;right:14px;bottom:14px;background:#2a2923;color:#fff;border-radius:14px;padding:6px 18px;font-size:14px}
.csend.hot{background:#000;box-shadow:0 0 0 4px rgba(42,41,35,.18)}
.ptime{position:absolute;left:20px;bottom:14px;color:#fff;font-size:13px}
/* end: chat panel */
.chat{position:absolute;left:770px;top:60px;width:340px}
.chat .ubub{position:static;width:auto}
.chat .who{margin-top:22px}
.chat p.r{font-size:14px;color:#3a3940;line-height:1.55;margin-top:10px}
.thumb{margin-top:12px;width:190px;height:120px;border-radius:10px;overflow:hidden;position:relative;background:#111}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .play{position:absolute;left:50%;top:50%;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;background:rgba(255,255,255,.85)}
.thumb .play:after{content:"";position:absolute;left:14px;top:10px;border-left:12px solid #222;border-top:8px solid transparent;border-bottom:8px solid transparent}
.thumb span{position:absolute;right:8px;bottom:6px;color:#fff;font-size:12px}
</style></head>
<body>
<div class="bar"><div class="dots"><i></i><i></i><i></i></div>
 <div class="tab"><img src="favicon.png"><span>Pexo</span></div>
 <div class="url">pexo.ai</div></div>
<div class="page" id="page"></div>
<script>
const S = decodeURIComponent(location.hash.slice(1) || 'home');
const page = document.getElementById('page');
const CLIP = n => `cafe_${n}.png`;
const chipsHTML = `<div class="chips">
 <div class="chip"><span class="ico" style="background:linear-gradient(135deg,#ffd9c7,#ffc2b0)"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M3 19l6-8 4 5 3-3 5 6z" fill="#ff8a6a"/><circle cx="16" cy="7" r="2.5" fill="#ffb14a"/></svg></span>Image</div>
 <div class="chip"><span class="ico" style="background:linear-gradient(135deg,#dcd3ff,#f0d3ff)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a98cf5" stroke-width="2.2" stroke-linecap="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg></span>Link</div>
 <div class="chip"><span class="ico" style="background:linear-gradient(135deg,#ccf3e8,#d8f6f0)"><svg width="18" height="18" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2" fill="#7fd9c0"/><path d="M8 9h8M8 13h8M8 17h5" stroke="#fff" stroke-width="1.8"/></svg></span>Reference</div>
 <div class="chip"><span class="ico" style="background:linear-gradient(135deg,#d6e6ff,#e2ddff)"><svg width="20" height="18" viewBox="0 0 26 20" stroke="#8aa6f5" stroke-width="2" stroke-linecap="round"><path d="M2 8v4M6 5v10M10 2v16M14 6v8M18 3v14M22 7v6"/></svg></span>Audio clip</div></div>`;
const cursor = (x, y) => `<svg class="cursor" style="left:${x}px;top:${y}px" viewBox="0 0 26 36"><path d="M2 2 L2 28 L9 21 L14 33 L19 31 L14 19 L24 19 Z" fill="#111" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>`;
const sky = `<div class="sky"></div><div class="cloud" style="left:-60px;top:120px;width:420px;height:200px"></div><div class="cloud" style="left:1080px;top:420px;width:460px;height:220px"></div><div class="cloud" style="left:200px;top:640px;width:520px;height:200px"></div>`;
const PROMPT = 'Create a 20-second Instagram promo for a cozy café from my clips, warm shots and upbeat music. 9:16.';
const files = n => `<div class="files">${[1,2,3,4,5].slice(0,n).map(i=>`<div class="file"><img src="${CLIP(((i-1)%4)+1)}">clip${i}.mp4</div>`).join('')}</div>`;

function promptScreen(text, nfiles, caret, sendOn, cur) {
  return `${sky}<img class="logo" src="pexo-logo.svg">
  <div class="card">${chipsHTML}
   <div class="txt">${text}${caret ? '<span class="caret"></span>' : ''}</div>
   ${nfiles ? files(nfiles) : ''}
   <div class="row"><div class="plus">+</div><div class="send ${sendOn ? '' : 'off'}">&#8593;</div></div>
  </div>${cur || ''}`;
}
const ububHTML = `<div class="ubub"><div class="chips">${chipsHTML.replace('<div class="chips">','').replace(/<\/div>$/,'')}</div>
  <p>${PROMPT}</p>${files(5)}</div>`;
function planScreen(k) {
  const items = ['Read your 5 clips', 'Write a punchy 9:16 script', 'Pick the shots & add music', 'Render the final cut'];
  return `${sky}<div class="win"><div class="wtitle">Cozy Café Promo</div><div class="x">&#215;</div>
   ${ububHTML}
   <div class="reply"><div class="who"><img src="pexo-logo.svg"></div>
    <p>Love the brief - a cozy café promo calls for warm, close-up shots and a beat that keeps moving.</p>
    <div class="plan"><h4>&#10022; Plan the café promo</h4><ul>
     ${items.map((t,i)=>`<li class="${i<k?'done':(i==k?'now':'')}"><b>${i<k?'&#10003;':''}</b>${t}</li>`).join('')}
    </ul></div></div></div>`;
}
const SUBS = ['Your morning starts here.', 'Poured by hand.', 'Fresh from the oven.', 'Come in, stay a while.'];
function readyScreen(n) {
  return `${sky}<div class="win" style="left:150px;top:30px"><img class="rlogo" src="pexo-logo.svg"><div class="wtitle">Cozy Café Promo</div><div class="x">&#215;</div>
   <div class="rh">Your video is ready</div><div class="rs">Polished. Ready to publish.</div>
   <div class="player"><img src="${CLIP(n)}"><div class="sub">${SUBS[n-1]}</div>
    <div class="prog"><i style="width:${n*23}%"></i></div>
    <div class="ctl">&#10074;&#10074;<span>00:0${n*4} / 00:20</span><span style="margin-left:auto">9:16</span></div></div>
   <div class="dotline"></div>
   <div class="side"><div class="scard">Voiceover<span class="ok">&#10003;</span></div><div class="scard">Music<span class="ok">&#10003;</span></div><div class="scard">Captions<span class="ok">&#10003;</span></div></div>
  </div>`;
}
function commentScreen(text, hot, cur) {
  return `${sky}<div class="win"><div class="wtitle">Cozy Café Promo</div><div class="x">&#215;</div>
   <div class="cframe"><div class="ctag">Commenting</div><div class="fname"><i></i>Cozy Café Promo.mp4</div>
    <div class="tools"><span class="pen">&#9998;</span><span>&#9633;</span><span>&#8599;</span><span class="c" style="background:#f6a04d"></span><span class="c" style="background:#f04b3b"></span><span>&#8630;</span><span style="color:#bbb">&#8631;</span><span>&#128465;</span></div>
    <div class="cplayer"><img src="${CLIP(2)}"><div class="mark" style="left:250px;top:250px;width:180px;height:140px"></div><div class="ptime">&#9654; 00:04 / 00:20</div></div>
    <div class="cbox"><span class="pill">00:04</span><p>${text}${hot ? '' : '<span class="caret" style="height:18px"></span>'}</p><div class="csend ${hot ? 'hot' : ''}">Send</div></div>
   </div></div>${cur || ''}`;
}
function endScreen() {
  return `${sky}<div class="win"><div class="wtitle">Cozy Café Promo</div><div class="x">&#215;</div>
   <div class="player" style="left:70px;top:90px;width:360px;height:640px"><img src="${CLIP(4)}"><div class="sub">${SUBS[3]}</div><div class="ctl">&#9654;<span>00:00 / 00:20</span></div></div>
   <div class="chat" style="left:500px;top:70px;width:580px">
    <div class="ubub" style="position:static"><p style="margin-top:0">Make the latte shot a bit longer</p></div>
    <div class="who"><img src="pexo-logo.svg"></div>
    <p class="r">All done! Your video's ready - take a look and let me know if you'd like any tweaks.</p>
    <div class="thumb"><img src="${CLIP(1)}"><div class="play"></div><span>20s</span></div>
   </div></div>`;
}

let h = '';
const m = S.match(/^(\w+?)(\d*)$/); const kind = m[1], n = +(m[2] || 0);
// the real home page, cropped above its gallery row (people and other companies' names are never shown)
if (kind === 'home') h = `<div style="position:absolute;inset:0;background:#f8f6f1"></div><div style="position:absolute;left:0;top:0;width:1440px;height:582px;overflow:hidden"><img class="home" src="home-2x.png"></div>`;
else if (kind === 'type') h = promptScreen(PROMPT.slice(0, [0, 30, 66, PROMPT.length][n]), 0, true, n > 0);
else if (kind === 'files') h = promptScreen(PROMPT, n, false, true, n === 1 ? cursor(352, 476) : '');
else if (kind === 'send') h = promptScreen(PROMPT, 5, false, true, n ? cursor(1080, 476) : cursor(1160, 600));
else if (kind === 'plan') h = planScreen(n);
else if (kind === 'ready') h = readyScreen(n);
else if (kind === 'comment') {
  const T = 'Make the latte shot a bit longer';
  h = commentScreen(T.slice(0, [0, 14, T.length, T.length][n]), n === 3, n === 3 ? cursor(1168, 372) : '');
}
else if (kind === 'end') h = endScreen();
page.innerHTML = h;
</script>
</body></html>
